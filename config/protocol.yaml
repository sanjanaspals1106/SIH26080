# Protocol Configuration (PRD §10 & Appendix B)
random_seed: 42

split_rules:
  min_seasons_required: 3
  tiers:
    full:
      min_seasons: 8
      n_holdout: 2
      status: "FULL_PROTOCOL"
    reduced:
      min_seasons: 5
      max_seasons: 7
      n_holdout: 1
      status: "REDUCED_HOLDOUT"
    dev_only:
      min_seasons: 3
      max_seasons: 4
      n_holdout: 0
      status: "DEVELOPMENT_ONLY"

settings_search:
  n_combinations: 20
  n_validation_seasons: 3

event_counting:
  min_events_primary: 30
  primary_threshold_mm: 64.5
  fallback_threshold_mm: 15.6

memory:
  train_cell_stride: 1
  fallback_cell_stride: 2

primary_metrics:
  P1:
    name: "RMSE"
    description: "RMSE of the corrected mean against observed rain, all leads together"
  P2:
    name: "ETS"
    threshold_mm: 64.5
    description: "ETS at 64.5 mm"
  P3:
    name: "FSS"
    threshold_mm: 64.5
    neighbourhood_cells: 5
    description: "FSS at 64.5 mm with 5x5-cell neighbourhood"
  P4:
    name: "BSS"
    threshold_mm: 64.5
    description: "Brier skill score for P(rain >= 64.5 mm) compared with climatology"
  P5:
    name: "coverage"
    range: [0.10, 0.90]
    target: 0.80
    description: "Share of observations falling inside q10-q90"

decision_rule_h1:
  ci_level: 0.95
  required_continuous: "P1"
  required_categorical_or_prob: ["P2", "P3", "P4"]
  no_metric_worse: true
  fallback_label: "no demonstrated benefit"

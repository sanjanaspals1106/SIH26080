# Verification Parameters (PRD §16 & Appendix B)

coverage:
  target: 0.80
  tolerance: 0.10

grouping:
  min_events: 10

spatial:
  neighbourhoods: [1, 3, 5, 9]
  primary_neighbourhood: 5

bootstrap:
  primary_block_days: 7
  sensitivity_block_days: [3, 14]
  resamples: 2000
  ci_level: 0.95

reliability:
  bins:
    - [0.0, 0.1]
    - [0.1, 0.2]
    - [0.2, 0.3]
    - [0.3, 0.4]
    - [0.4, 0.5]
    - [0.5, 0.6]
    - [0.6, 0.7]
    - [0.7, 0.8]
    - [0.8, 0.9]
    - [0.9, 1.0]

# Owner: M4. PRD section 16 and Appendix B. Status of each value is in the comment beside it.

forecast_types: [raw_nwp, quantile_mapping, global_ml, regime_aware_ml]   # Decision (16.1): B0..B3
evaluation_sets: [development, holdout]                                   # Decision (16.1)
quantiles: [0.1, 0.5, 0.9]                                                # Decision (13.7)

coverage:                          # Assumption (Appendix B, 13.7)
  target: 0.80
  tolerance: 0.10                  # 80% +/- 10 points

group_min_events: 10               # Assumption (Appendix B, 16.5): fewer -> "Not enough events"

fss:                               # Assumption (Appendix B, 16.2)
  neighbourhood_cells: [1, 3, 5, 9]
  primary_neighbourhood_cells: 5

bootstrap:                         # Assumption (Appendix B, 16.6)
  block_days: 7
  extra_block_days: [3, 14]
  resamples: 2000
  interval: 0.95

season_consistency:
  wilcoxon_min_seasons: 6          # Decision (16.6): with at least 6 seasons add a Wilcoxon signed-rank test

groups:                            # Decision (16.5)
  types: [all, lead_day, month, region_code, phase, lps_near, orographic_favorable, coastal_favorable, raw_rain_size]
  months: [6, 7, 8, 9]
  lps_near_distance_km: 500
  raw_rain_size_bins_mm: [1.0, 15.6, 64.5]   # below 1, 1-15.6, 15.6-64.5, 64.5 and above

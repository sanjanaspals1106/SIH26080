# Owner: M1. PRD sections 7, 8 and Appendix B. Status of each value is in the comment beside it.
# Only the values marked with Appendix B are from the parameter registry; the rest are Decisions
# written in PRD sections 2, 7.2, 8 and 9.

forecast:
  source: ECMWF-TIGGE-control      # Decision (D3)
  type: cf                         # Decision (D3)
  init_hour_utc: 0                 # Decision (D3): 00 UTC only
  lead_days: [1, 2, 3]             # Decision (D3)
  tp_steps_hours: [0, 6, 12, 18, 24, 30, 36, 42, 48, 54, 60, 66, 72, 78]   # Decision (7.2): 0..78 every 6 h
  atmosphere_steps_hours: [6, 12, 18, 24, 30, 36, 42, 48, 54, 60, 66, 72]  # Decision (7.2): 6..72 every 6 h
  download_area: { north: 40, west: 55, south: 0, east: 100 }              # Decision (7.2)
  grid_spacing_deg: 0.25           # Decision (7.2), if the ECDS form allows it (CK2)

truth:
  source: IMD gridded daily rainfall   # Decision (D4)
  grid_spacing_deg: 0.25               # Decision (D4, D5)
  grid_shape: { lat: 129, lon: 135 }   # Verified (7.1)
  grid_origin: { lat: 6.5, lon: 66.5 } # Verified (7.1)
  grid_end: { lat: 38.5, lon: 100.0 }  # Verified (7.1)
  missing_value: -999                  # Verified (7.1); becomes NaN (8.4)
  imd_day_end_ist: "08:30"             # Established (8.1)
  imd_day_end_utc: "03:00"             # Established (8.1); 08:30 IST = 03:00 UTC (test T6)

time_alignment:
  method: null                     # TODO(M1): set to C1 or C0 after check CK2; see PRD D6
  alignment_offset_hours: { C1: 0, C0: 3 }   # Decision (8.3): stored on every row
  imd_stamp: end_date              # Decision (8.2) default; T4 lag test may change it to start_date
  c1_window_start_hour: "24*(k-1)+3"   # Decision (8.3), k = lead day
  c1_window_end_hour: "24*k+3"         # Decision (8.3)
  window_negative_clip_max_share: 0.001   # Decision (T2): at most 0.1% of window values may be clipped from <0 to 0
  lag_test_shifts_days: [-1, 0, 1]        # Decision (8.2)
  lag_test_keep_end_date_margin: 0.02     # Decision (8.2): if best vs shift-0 differs by < 0.02 keep end_date

space:
  rain_regridding: area_average_or_containing_cell   # Decision (8.4): never bilinear for rain
  atmosphere_regridding: bilinear                    # Decision (8.4)
  km_per_quarter_degree_lat: 27.75                   # Assumption (8.6)

valid_cells:
  base_period: { start_year: 1981, end_year: 2010 }  # Decision (8.5, Appendix B)
  season_months: [6, 7, 8, 9]                        # JJAS (D2)
  min_non_missing_fraction: 0.95                     # Decision (Appendix B): non-missing on >= 95% of JJAS days

checks:
  max_rain_24h_mm: 1000                              # Assumption (9.2): rain >= 0 and below 1000 mm in 24 h
  tp_non_decreasing_min_share: 0.999                 # Decision (CK4 / T1)
